modules:
  - name: Install ReadySet
    type: repos
    body:
      custom:
        - rpm https://altlinux.space/api/packages/alt-gnome/alt/group/ready-set-nightly/sisyphus.repo _arch_ classic
        - rpm https://altlinux.space/api/packages/alt-gnome/alt/group/ready-set-nightly/sisyphus.repo noarch classic

  - type: packages
    body:
      install:
        - ready-set-gdm
        - ready-set-plugin-language
        - ready-set-plugin-keyboard
        - ready-set-plugin-date-and-time
        - ready-set-plugin-user-passwdqc
        - ready-set-plugin-atomic-finalize

  - name: Copy configuration
    type: copy
    body:
      source: root
      destination: /
      replace: true
