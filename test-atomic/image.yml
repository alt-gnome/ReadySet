modules:
  - name: Build ReadySet
    type: shell
    body:
      command: |
        cd /src
        make setup
        make install

  - name: Enable any
    type: systemd
    body:
      targets:
        - ready-set-any
      enabled: true

  - name: Install greetd
    type: packages
    body:
      install:
        - greetd
        - weston

  - name: Install any wm
    type: copy
    body:
      source: any
      destination: /usr/libexec/ready-set-wm
      replace: true

  - name: Install config
    type: copy
    body:
      source: config
      destination: /usr/share/ready-set/config
      replace: true

  - name: Cleanup
    type: include
    body:
      targets:
        - /usr/share/apm/includes/common/cleanup.yml
