modules:
  - name: Build ReadySet
    type: shell
    body:
      command: |
        cd /src
        make setup
        make install

  - name: Install config
    type: copy
    body:
      source: config
      destination: /usr/share/ready-set/config
      replace: true

  - name: Cleanup
    type: include
    body:
      targets:
        - /usr/share/apm/includes/common/cleanup.yml
